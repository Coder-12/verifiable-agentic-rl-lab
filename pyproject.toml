[project]
name = "verifiable-agentic-rl-lab"
version = "0.1.0"
description = "A small-budget research framework for verifiable RLFT/RLVR experiments, starting with Countdown arithmetic and scaling toward agentic RL."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Aklesh Mishra" }
]

dependencies = [
  "torch>=2.2.0",
  "transformers>=4.45.0",
  "datasets>=2.20.0",
  "accelerate>=0.33.0",
  "trl>=0.11.0",
  "peft>=0.12.0",
  "tensorboard>=2.17.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "tqdm>=4.66.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

notebooks = [
  "jupyter>=1.0.0",
  "ipykernel>=6.29.0",
  "matplotlib>=3.8.0",
]

gcs = [
  "google-cloud-storage>=2.16.0",
  "google-crc32c>=1.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"
